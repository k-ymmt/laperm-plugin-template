# Builds plugin.wasm and publishes it with manifest.json as a GitHub Release when a tag `v<version>` is pushed.
# Laperm installs from `releases/latest/download/{manifest.json,plugin.wasm}`, so every release must carry both.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Check that the tag matches manifest.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          if [ "$version" != "$manifest" ]; then
            echo "tag v$version does not match manifest.json version $manifest" >&2
            exit 1
          fi
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release --target wasm32-unknown-unknown
      - name: Collect assets
        run: |
          mkdir -p dist
          cp target/wasm32-unknown-unknown/release/*.wasm dist/plugin.wasm
          cp manifest.json dist/manifest.json
          ls -la dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/manifest.json dist/plugin.wasm --title "$GITHUB_REF_NAME" --generate-notes
